<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cash Book · Payables Tracker</title><link rel="stylesheet" href="cashbook.css?v=1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="cb-page"><header><a href="index.html" class="back">← Dashboard</a><h1>Cash Book</h1><p>Independent account-wise cash ledger</p></header><section class="cb-panel"><div class="cb-account"><label>Account<select id="accountSelect"><option value="">Select account</option></select></label><button id="addAccount" class="secondary">＋ New account</button></div><div class="cb-controls"><label>Month<input type="month" id="monthSelect"></label><label>Opening balance ₹<input type="number" id="opening" step="0.01"></label><button id="saveOpening" class="secondary">Save opening balance</button></div><section class="cb-balance"><small>Closing balance</small><strong id="closing">₹0.00</strong></section><div class="cb-totals"><div><small>Money in</small><b id="credits">₹0.00</b></div><div><small>Money out</small><b id="debits">₹0.00</b></div></div><div class="cb-trans-head"><h2>Transactions</h2><button id="addTxn">＋ Add transaction</button></div><div class="cb-tablewrap"><table><thead><tr><th>Date</th><th>Description</th><th>Credit</th><th>Debit</th><th>Balance</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><dialog id="accountDialog"><form id="accountForm"><h2>Create Cash Book account</h2><label>Account name<input id="newAccountName" required maxlength="60"></label><label>Type<select id="newAccountType"><option value="cash">Cash</option><option value="bank">Bank</option><option value="wallet">Wallet / UPI</option><option value="other">Other</option></select></label><div class="actions"><button type="button" class="secondary" id="accountCancel">Cancel</button><button type="submit">Save account</button></div></form></dialog><dialog id="txnDialog"><form id="txnForm"><h2>New transaction</h2><label>Type<select id="direction"><option value="out">Debit · Money out</option><option value="in">Credit · Money in</option></select></label><label>Description<input id="description" required></label><label>Amount ₹<input id="amount" type="number" min="0.01" step="0.01" required></label><p class="hint">Date will be recorded automatically as today.</p><div class="actions"><button type="button" class="secondary" id="txnCancel">Cancel</button><button type="submit">Save transaction</button></div></form></dialog><script src="cashbook.js?v=1"></script></body></html>
