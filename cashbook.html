<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cash Book</title><link rel="stylesheet" href="cashbook.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main><header><a href="index.html">← Home</a><h1>Cash Book</h1><p>Daily account-wise cash in/out</p></header><section><div class="row"><label>Account<select id="accountSelect"></select></label><button id="addAccount">＋ Add account</button></div><div class="row"><label>Month<input type="month" id="monthSelect"></label><label>Opening balance<input type="number" id="opening" step=".01"></label><button id="saveOpening">Save opening balance</button></div><h2>Closing balance <span id="closing">₹0</span></h2><div class="summary"><p>Money In <b id="credits">₹0</b></p><p>Money Out <b id="debits">₹0</b></p></div><div class="row"><h2>Transactions</h2><button id="addTxn">＋ Add transaction</button></div><div class="scroll"><table><thead><tr><th>Date</th><th>Description</th><th>Credit</th><th>Debit</th><th>Balance</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><dialog id="accountDialog"><form id="accountForm"><h2>New account</h2><label>Name<input id="accountName" required></label><label>Type<select id="accountType"><option>Cash</option><option>Bank</option><option>Wallet / UPI</option><option>Other</option></select></label><button type="button" id="accountCancel">Cancel</button><button type="submit">Save account</button></form></dialog><dialog id="txnDialog"><form id="txnForm"><h2>New transaction</h2><label>Direction<select id="direction"><option value="out">Debit</option><option value="in">Credit</option></select></label><label>Description<input id="description" required></label><label>Amount<input id="amount" type="number" min=".01" step=".01" required></label><button type="button" id="txnCancel">Cancel</button><button type="submit">Save</button></form></dialog><script src="cashbook.js"></script></body></html>
