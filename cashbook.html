<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cash Book</title><link rel="stylesheet" href="cashbook.css?v=cashbook-fix-20261118"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main><header><a href="index.html">← Home</a> <a href="sms-capture.html" class="sms-settings-link">SMS Capture Settings</a><h1>Cash Book</h1><p>Daily account-wise cash in/out</p></header><section class="controls"><div class="selector-row"><label class="account-field">Account<div class="account-control"><select id="accountSelect"></select><button type="button" id="addAccount" class="add-account">＋ Add</button></div></label><label class="month-field">Month<input type="month" id="monthSelect"></label></div><div class="balance-grid"><div class="balance-card opening-card"><div class="balance-label">Opening Balance</div><div class="balance-value"><span id="openingDisplay">₹0.00</span><button type="button" id="editOpening" class="edit-balance" aria-label="Edit opening balance">✎</button></div><div class="opening-edit" id="openingEdit"><input type="number" id="opening" step=".01" aria-label="Opening balance"><button type="button" id="saveOpening">Save</button></div></div><div class="balance-card closing-card"><div class="balance-label">Closing Balance</div><div class="balance-value" id="closing">₹0.00</div></div></div><div class="transactions-header"><h2>Transactions</h2><button id="addTxn" class="primary-button">＋ Add Transaction</button></div><div id="transactions" class="transactions-list"></div></section></main><dialog id="accountDialog"><form id="accountForm"><h2>New account</h2><label>Name<input id="accountName" required></label><label>Type<select id="accountType"><option>Cash</option><option>Bank</option><option>Wallet / UPI</option><option>Other</option></select></label><button type="button" id="accountCancel" class="secondary-button">Cancel</button><button type="submit" class="primary-button">Save account</button></form></dialog><dialog id="txnDialog"><form id="txnForm"><h2>New transaction</h2><label>Direction<select id="direction"><option value="out">Debit</option><option value="in">Credit</option></select></label><label>Description<input id="description" required></label><label>Amount<input id="amount" type="number" min=".01" step=".01" required></label><button type="button" id="txnCancel" class="secondary-button">Cancel</button><button type="submit" class="primary-button">Save</button></form></dialog><script src="cashbook.js?v=cashbook-fix-20261118"></script></body></html>
