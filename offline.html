<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>You're offline · Payables Tracker</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f5f8;color:#172337;font:16px system-ui,-apple-system,sans-serif}
    main{width:min(100%,440px);padding:30px;border-radius:22px;background:#fff;box-shadow:0 12px 40px #17233712;text-align:center}
    .mark{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 18px;border-radius:20px;background:#101827;color:#fff;font-size:34px}
    h1{margin:0 0 10px;font-size:25px}p{color:#64748b;line-height:1.6}button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#173b35;color:white;font:inherit;font-weight:650}
  </style>
</head>
<body><main><div class="mark">₹</div><h1>You're offline</h1><p>Payables Tracker needs an internet connection to load your latest financial information and save changes. Reconnect and try again.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
