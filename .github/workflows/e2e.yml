name: Payables Tracker E2E

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: payables-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  safe-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run isolated parser and event traceability tests
        run: node --test tests/sms-parser.test.mjs tests/sms-event-traceability.test.mjs

# Browser tests are intentionally not run in CI until the frontend can target a
# dedicated isolated Supabase project. Current app bundles point at production
# and the browser suite creates, edits, settles and captures records.
