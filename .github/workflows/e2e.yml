name: Payables Tracker E2E
on:
  push:
    branches: [main, test-env, 'test/**']
  pull_request:
    branches: [main, test-env]
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"
concurrency:
  group: payables-e2e-shared-test-account
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_URL: https://payables-tracker-ten.vercel.app
      SUPABASE_URL: https://magxbczgrxeypryjborr.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      TEST_USER_B_EMAIL: ${{ secrets.TEST_USER_B_EMAIL }}
      TEST_USER_B_PASSWORD: ${{ secrets.TEST_USER_B_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run SMS parser regression tests
        run: node --test tests/sms-parser.test.mjs
      - run: npx playwright install chromium
      - name: Run browser tests against live Vercel production and Supabase
        run: npx playwright test
      - name: Upload full E2E recording, screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
