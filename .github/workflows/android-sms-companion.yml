name: Android SMS Companion
on:
  workflow_dispatch:
  push:
    branches: [feature/android-sms-bridge]
    paths:
      - "android-sms-companion/**"
      - ".github/workflows/android-sms-companion.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android-sms-companion
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: payables-sms-companion-debug
          path: android-sms-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
